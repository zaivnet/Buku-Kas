version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bukukas_app
    restart: always
    ports:
      - "1990:80"
    environment:
      APP_NAME: "Buku Kas Digital"
      APP_ENV: "production"
      APP_KEY: "base64:7Kx2T+gN/eXp93x2A73gW33lJ510793x2A73gW33lJ4=" # Replace with your key
      APP_DEBUG: "false"
      APP_URL: "http://localhost:1990"
      LOG_CHANNEL: "daily"
      DB_CONNECTION: "mysql"
      DB_HOST: "db"
      DB_PORT: "3306"
      DB_DATABASE: "bukukas"
      DB_USERNAME: "bukukas_user"
      DB_PASSWORD: "bukukas_password"
      SESSION_DRIVER: "database"
      CACHE_STORE: "database"
      FILESYSTEM_DISK: "public"
      AUTO_SEED: "true"
    volumes:
      - storage_data:/var/www/html/storage/app/public
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    container_name: bukukas_db
    restart: always
    environment:
      MYSQL_DATABASE: "bukukas"
      MYSQL_USER: "bukukas_user"
      MYSQL_PASSWORD: "bukukas_password"
      MYSQL_ROOT_PASSWORD: "root_password"
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
    driver: local
  storage_data:
    driver: local
